    <linearGradient id="beamLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9a7ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7fd9ff" stop-opacity="0.55"/>
